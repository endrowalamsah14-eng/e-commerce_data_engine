# =====================================================================
# REDIS VALUES - HOT OPERATIONAL STORE (HETZNER VPS OPTIMIZED)
# =====================================================================

# Using standalone architecture to save resources on the current VPS
architecture: standalone

auth:
  enabled: true
  # Default password for prototype environment
  password: "redis-dev-password"

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 2Gi

  # Strict resource limits to prevent Hetzner node starvation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
