# =====================================================================
# TEMPORAL VALUES - THE CONTROL PLANE (HETZNER VPS OPTIMIZED)
# =====================================================================

server:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgresql:5432
            connectProtocol: tcp
            user: temporal
            password: temporal-dev-password
            manageSchema: true  # <--- Aturan baru pengganti schema.setup
        visibility:
          sql:
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgresql:5432
            connectProtocol: tcp
            user: temporal
            password: temporal-dev-password
            manageSchema: true  # <--- Aturan baru pengganti schema.setup

