starrocks:
  starrocksFESpec:
    # Frontend Node: Manages metadata, client connections, and query parsing
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

  starrocksBeSpec:
    # Backend Node: Executes vectorized queries against MinIO data
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi