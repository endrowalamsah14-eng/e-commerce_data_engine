# =====================================================================
# BENTHOS VALUES - THE DATA CONTRACT & ROUTER (HETZNER VPS OPTIMIZED)
# =====================================================================

replicaCount: 2

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

# ---------------------------------------------------------------------
# PIPELINE CONFIGURATION
# ---------------------------------------------------------------------
config:
  input:
    kafka_franz:
      seed_brokers: ["redpanda-0.redpanda.emarkrtz-production.svc.cluster.local:9092"]
      topics:
        - "cdc.all_shards.orders"
        - "cdc.all_shards.order_lines"
      consumer_group: "benthos-router-group"

  pipeline:
    processors:
      - mapping: |
          root._contract_error = if this.store_id == null {
            "missing_store_id"
          } else if this.order_id == null {
            "missing_order_id"
          } else if metadata("kafka_topic") == "cdc.all_shards.order_lines" && this.line_id == null {
            "missing_line_id"
          } else {
            deleted()
          }

      - mapping: |
          root.contract_error = this._contract_error
          root.original_payload = if this._contract_error != null { this } else { deleted() }
          root.id = if this._contract_error == null { this.order_id } else { deleted() }
          root.store_identifier = if this._contract_error == null { this.store_id } else { deleted() }
          root.ingested_at = if this._contract_error == null { now() } else { deleted() }

  output:
    switch:
      cases:
        - check: this._contract_error != null
          output:
            kafka_franz:
              seed_brokers: ["redpanda-0.redpanda.emarkrtz-production.svc.cluster.local:9092"]
              topic: "dlq.ingestion_errors"
        - check: meta("kafka_topic") == "cdc.all_shards.orders"
          output:
            kafka_franz:
              seed_brokers: ["redpanda-0.redpanda.emarkrtz-production.svc.cluster.local:9092"]
              topic: "sink.scylladb.orders"
        - check: meta("kafka_topic") == "cdc.all_shards.order_lines"
          output:
            kafka_franz:
              seed_brokers: ["redpanda-0.redpanda.emarkrtz-production.svc.cluster.local:9092"]
              topic: "sink.minio.order_lines"