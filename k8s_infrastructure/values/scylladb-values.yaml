# =====================================================================
# SCYLLADB VALUES - HOT OPERATIONAL STORE (HETZNER VPS OPTIMIZED)
# =====================================================================

# Enable Developer Mode to bypass strict production hardware checks.
# This is mandatory for running ScyllaDB smoothly on a single-node Hetzner VPS
# without triggering quorum or multi-disk validation errors.
developerMode: true

# Define the cluster topology optimized for a single datacenter
datacenter: "hetzner-dc1"

racks:
  - name: "rack1"
    # MAGIC NUMBER: Set to 1 member.
    # Ensures no resource starvation by restricting the database to a single pod.
    members: 1

    storage:
      capacity: 20Gi
      storageClassName: "local-path"

    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 2
        # ScyllaDB utilizes a seastar architecture (thread-per-core).
        # Capping memory at 4Gi to leave room for Redpanda and Benthos.
        memory: 4Gi

# =====================================================================
# MAINTENANCE & OBSERVABILITY
# =====================================================================
scylla-manager:
  # Disable Scylla Manager for this deployment phase to conserve VPS resources.
  # Automated repairs are unnecessary for a single-node developer topology.
  enabled: false