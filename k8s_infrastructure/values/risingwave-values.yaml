# =====================================================================
# RISINGWAVE VALUES - REAL-TIME STREAMING DB (HETZNER VPS OPTIMIZED)
# =====================================================================

# Enable embedded etcd and MinIO specifically for RisingWave's internal state management.
# This prevents the need for an external state backend cluster during this phase.
tags:
  etcd: true
  minio: true
  postgresql: true

etcd:
  persistence:
    enabled: true

minio:
  persistence:
    enabled: true

postgresql:
  primary:
    persistence:
      enabled: true

# ADDED: Enable RisingWave Console (Dashboard UI)
console:
  enabled: true
  service:
    type: ClusterIP
    port: 5001

# 1. The Metadata Management Node
metaNode:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# 2. The Heavy Lifter (Stream & Batch Execution Engine)
computeNode:
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

# 3. The Query Interface (PostgreSQL Wire Protocol Compatible)
frontendNode:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# 4. The Storage Optimizer (Handles LSM-Tree Compactions)
compactorNode:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
