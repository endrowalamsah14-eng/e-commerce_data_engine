apiVersion: v1
kind: Service
metadata:
  name: peerdb-catalog
spec:
  selector:
    app.kubernetes.io/name: peerdb-catalog
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: peerdb-flow-api
spec:
  selector:
    app.kubernetes.io/name: peerdb-flow-api
  ports:
    - name: grpc
      port: 8112
      targetPort: 8112
    - name: http
      port: 8113
      targetPort: 8113
---
apiVersion: v1
kind: Service
metadata:
  name: peerdb-server
spec:
  selector:
    app.kubernetes.io/name: peerdb-server
  ports:
    - name: api
      port: 9900
      targetPort: 9900
---
apiVersion: v1
kind: Service
metadata:
  name: peerdb-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: peerdb-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30301
