apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peerdb-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peerdb-catalog
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerdb-secrets
                  key: catalog-password
            - name: POSTGRES_DB
              value: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-flow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peerdb-flow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peerdb-flow-api
    spec:
      containers:
        - name: flow-api
          image: ghcr.io/peerdb-io/flow-api:{{ .Values.imageTag }}
          ports:
            - containerPort: 8112
            - containerPort: 8113
          env:
            - name: PEERDB_CATALOG_HOST
              value: peerdb-catalog
            - name: PEERDB_CATALOG_PORT
              value: "5432"
            - name: PEERDB_CATALOG_USER
              value: postgres
            - name: PEERDB_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerdb-secrets
                  key: catalog-password
            - name: PEERDB_CATALOG_DATABASE
              value: postgres
            - name: TEMPORAL_HOST_PORT
              value: temporal-frontend.emarkrtz-production.svc.cluster.local:7233
            - name: PEERDB_TEMPORAL_NAMESPACE
              value: default
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootUser
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootPassword
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ENDPOINT
              value: http://minio:9000
            - name: PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3
              value: http://minio:9000
            - name: PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME
              value: peerdbbucket
---
