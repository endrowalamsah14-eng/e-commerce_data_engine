apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peerdb-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peerdb-server
    spec:
      containers:
        - name: peerdb-server
          image: ghcr.io/peerdb-io/peerdb-server:{{ .Values.imageTag }}
          ports:
            - containerPort: 9900
          env:
            - name: PEERDB_CATALOG_HOST
              value: peerdb-catalog
            - name: PEERDB_CATALOG_PORT
              value: "5432"
            - name: PEERDB_CATALOG_USER
              value: postgres
            - name: PEERDB_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerdb-secrets
                  key: catalog-password
            - name: PEERDB_CATALOG_DATABASE
              value: postgres
            - name: PEERDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerdb-secrets
                  key: peerdb-password
            - name: PEERDB_FLOW_SERVER_ADDRESS
              value: grpc://peerdb-flow-api:8112
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peerdb-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peerdb-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peerdb-ui
    spec:
      containers:
        - name: peerdb-ui
          image: ghcr.io/peerdb-io/peerdb-ui:{{ .Values.imageTag }}
          ports:
            - containerPort: 3000
          env:
            - name: PEERDB_CATALOG_HOST
              value: peerdb-catalog
            - name: PEERDB_CATALOG_PORT
              value: "5432"
            - name: PEERDB_CATALOG_USER
              value: postgres
            - name: PEERDB_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peerdb-secrets
                  key: catalog-password
            - name: PEERDB_CATALOG_DATABASE
              value: postgres
            - name: PEERDB_FLOW_SERVER_HTTP
              value: http://peerdb-flow-api:8113
            - name: NEXTAUTH_SECRET
              value: peerdb-nextauth-secret
            - name: NEXTAUTH_URL
              value: http://peerdb-ui:3000
